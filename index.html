<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ponkichi 記帳</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header id="app-header">
  <button id="btn-back" class="icon-btn" aria-label="戻る" hidden>← 戻る</button>
  <h1 id="header-title">剣山醸造所 記帳</h1>
  <span id="queue-badge" class="badge" hidden>0</span>
</header>

<main id="app-main">

  <!-- ホーム画面 -->
  <section id="screen-home" class="screen">
    <p class="lead">何を記録しますか？</p>
    <div class="menu-grid">
      <button class="menu-btn menu-btn--active" data-action="start-nyuka"><span class="menu-ico">📦</span><span class="menu-label">入荷</span></button>
      <button class="menu-btn menu-btn--active" data-action="start-hakko"><span class="menu-ico">🧪</span><span class="menu-label">欠減・測定</span></button>
      <button class="menu-btn menu-btn--active" data-action="start-bt"><span class="menu-ico">🛢️</span><span class="menu-label">BT移送</span></button>
      <button class="menu-btn menu-btn--active" data-action="start-seihin"><span class="menu-ico">🍺</span><span class="menu-label">詰口</span></button>
    </div>
    <div class="home-footer">
      <button id="btn-goto-history" class="link-btn">送信履歴・未送信キュー</button>
      <button id="btn-goto-settings" class="link-btn">⚙ 設定</button>
    </div>
    <p id="bridge-status" class="status-line"></p>
  </section>

  <!-- 設定画面 -->
  <section id="screen-settings" class="screen" hidden>
    <h2>設定</h2>
    <label class="field-label" for="input-bridge-url">送信先URL（Ponkichiブリッジ）</label>
    <p class="hint">Ponkichiブリッジの送信先URLを貼り付けてください。URLはこの端末にだけ保存され、アプリのコードには含まれません。</p>
    <textarea id="input-bridge-url" class="text-input" rows="3" placeholder="https://script.google.com/macros/s/.../exec"></textarea>
    <button id="btn-save-url" class="primary-btn">保存する</button>
    <p id="settings-save-msg" class="status-line"></p>

    <hr>
    <h2>原料マスター</h2>
    <!-- 原料・製品の2行を出すため改行を保持する（textContentに \n を入れている） -->
    <p id="masters-status" class="hint hint-multiline"></p>
    <button id="btn-refresh-masters" class="secondary-btn">マスターを再取得する</button>
    <p id="masters-refresh-msg" class="status-line"></p>

    <hr>
    <button id="btn-settings-back" class="secondary-btn">ホームへ戻る</button>
  </section>

  <!-- 履歴・キュー画面 -->
  <section id="screen-history" class="screen" hidden>
    <h2>未送信キュー</h2>
    <p id="queue-empty-msg" class="hint" hidden>未送信の記録はありません。</p>
    <ul id="queue-list" class="list"></ul>
    <button id="btn-flush-now" class="primary-btn">今すぐ再送信する</button>
    <p id="flush-msg" class="status-line"></p>

    <h2>送信履歴（直近20件）</h2>
    <ul id="history-list" class="list"></ul>

    <button id="btn-history-back" class="secondary-btn">ホームへ戻る</button>
  </section>

  <!-- 入荷ウィザード：質問（データ駆動で1画面だけ使い回す） -->
  <section id="screen-wizard" class="screen" hidden>
    <p id="wizard-step-indicator" class="step-indicator"></p>
    <h2 id="wizard-question"></h2>
    <p id="wizard-hint" class="hint"></p>
    <div id="wizard-body"></div>
    <p id="wizard-error" class="error-line" hidden></p>
    <div class="wizard-nav">
      <button id="btn-wizard-next" class="primary-btn">次へ</button>
    </div>
  </section>

  <!-- 確認画面 -->
  <section id="screen-confirm" class="screen" hidden>
    <h2>この内容で送信しますか？</h2>
    <ul id="confirm-list" class="confirm-list"></ul>
    <button id="btn-confirm-send" class="primary-btn primary-btn--big">送信する</button>
    <button id="btn-confirm-back" class="secondary-btn">やり直す</button>
  </section>

  <!-- 結果画面 -->
  <section id="screen-result" class="screen" hidden>
    <p id="result-icon" class="result-icon"></p>
    <h2 id="result-title"></h2>
    <p id="result-message" class="hint"></p>
    <button id="btn-result-again" class="primary-btn">続けて記録する</button>
    <button id="btn-result-home" class="secondary-btn">ホームへ戻る</button>
  </section>

</main>

<!-- 50kg超・未来日などの確認モーダル -->
<div id="modal-confirm" class="modal" hidden>
  <div class="modal-box">
    <p id="modal-message"></p>
    <div class="modal-actions">
      <button id="modal-btn-yes" class="primary-btn">はい</button>
      <button id="modal-btn-no" class="secondary-btn">いいえ</button>
    </div>
  </div>
</div>

<script src="./js/storage.js"></script>
<script src="./js/masters_seed.js"></script>
<script src="./js/masters.js"></script>
<script src="./js/send.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
